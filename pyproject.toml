[project]
name = "personal-assistant"
version = "1.0.0"
description = "通过 API Key 直连模型的本机桌面 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 本机 IPC 和可选回环 HTTP 入口
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.6",
    # Windows 运行时的时区数据库。
    "tzdata>=2024.1",
    # Provider 直接使用 httpx；socks extra 兼容桌面环境常见的 ALL_PROXY=socks5 配置。
    "httpx[socks]>=0.27",
    # 模型与工具契约校验
    "jsonschema>=4.26,<5",
    # MCP 与安全加固的 HTTP 传输（代码实际引用；与 requirements.txt 版本对齐）
    "mcp==2.0.0",
    "httpx2==2.9.1",
    "httpcore2==2.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_agent_core", "src/private_agent_local"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# 发布门禁口径（2026-08-06 固化）：E/F/I 基础规则，E501 长行属于仓库既有风格债务，
# 不作为门禁；与 docs/testing-guide.md §7 保持一致，`ruff check src tests scripts` 即该口径。
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
