# Install as /etc/nginx/conf.d/private-agent.conf after replacing the domain
# and certificate paths. This file is loaded inside Nginx's http context.
map $http_upgrade $private_agent_connection {
    default upgrade;
    ''      '';
}

server {
    listen 6000 ssl;
    listen [::]:6000 ssl;
    server_name agent.example.com;

    ssl_certificate     /etc/pki/tls/certs/agent.example.com.crt;
    ssl_certificate_key /etc/pki/tls/private/agent.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PrivateAgentTLS:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 100m;

    access_log /var/log/nginx/private-agent-access.log;
    error_log  /var/log/nginx/private-agent-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $private_agent_connection;

        # Agent/chat endpoints use long-running SSE responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }
}
