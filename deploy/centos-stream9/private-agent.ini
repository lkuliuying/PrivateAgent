[program:private-agent]
directory=/opt/private-agent/current
command=/opt/private-agent/current/.venv/bin/python -m personal_assistant.server_entry
user=privateagent
environment=HOME="/var/lib/private-agent",PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=45
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/private-agent/supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
