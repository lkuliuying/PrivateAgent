name: private-agent

services:
  mysql:
    image: mysql:8.0.41
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: personal_assistant
      MYSQL_USER: private_agent
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    secrets:
      - mysql_password
      - mysql_root_password
    networks:
      - backend

  api:
    image: private-agent-api:0.1.2
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PA_API_HOST: 0.0.0.0
      PA_API_PORT: 8000
      PA_API_AUTH_ENABLED: "true"
      PA_API_ALLOW_NON_LOOPBACK_BIND: "true"
      PA_API_TOKEN_FILE: /run/secrets/api_token
      PA_API_ALLOWED_HOSTS: ${PA_API_ALLOWED_HOSTS:-127.0.0.1,localhost}
      PA_API_ALLOWED_ORIGINS: ${PA_API_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000,http://127.0.0.1:1420,http://localhost:1420}
      PA_DB_URL: mysql+aiomysql://private_agent:@mysql:3306/personal_assistant?charset=utf8mb4
      PA_DB_PASSWORD_FILE: /run/secrets/mysql_password
      PA_OLLAMA_BASE_URL: ${PA_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      PA_LLM_MODEL: ${PA_LLM_MODEL:-qwen2.5:14b-instruct-q4_K_M}
      PA_EMBED_MODEL: ${PA_EMBED_MODEL:-bge-m3}
      PA_LLM_CONTEXT_LENGTH: ${PA_LLM_CONTEXT_LENGTH:-8192}
      PA_DATA_DIR: /app/data
      PA_AGENT_RUNS_API_ENABLED: ${PA_AGENT_RUNS_API_ENABLED:-false}
      PA_AGENT_RUN_READ_ONLY_TOOLS_ENABLED: ${PA_AGENT_RUN_READ_ONLY_TOOLS_ENABLED:-false}
      PA_AGENT_RAG_TOOLS_ENABLED: ${PA_AGENT_RAG_TOOLS_ENABLED:-false}
      PA_AGENT_CONTEXT_BUILDER_ENABLED: ${PA_AGENT_CONTEXT_BUILDER_ENABLED:-false}
      PA_CHAT_AGENT_RUNTIME_ENABLED: ${PA_CHAT_AGENT_RUNTIME_ENABLED:-false}
      PA_CONVERSATION_SUMMARY_WORKER_ENABLED: ${PA_CONVERSATION_SUMMARY_WORKER_ENABLED:-false}
      PA_CONVERSATION_SUMMARY_ALLOW_REMOTE_PROVIDER: ${PA_CONVERSATION_SUMMARY_ALLOW_REMOTE_PROVIDER:-false}
      PA_VERSIONED_RAG_INDEXING_ENABLED: ${PA_VERSIONED_RAG_INDEXING_ENABLED:-false}
      PA_VERSIONED_RAG_RETRIEVAL_ENABLED: ${PA_VERSIONED_RAG_RETRIEVAL_ENABLED:-false}
      PA_MCP_ENABLED: ${PA_MCP_ENABLED:-false}
      PA_LOG_LEVEL: ${PA_LOG_LEVEL:-INFO}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${PA_DOCKER_API_PORT:-8000}:8000
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    volumes:
      - private_agent_data:/app/data
    secrets:
      - api_token
      - mysql_password
    networks:
      - backend
      - egress

  # Optional replacement for an unstable host Ollama Desktop installation.
  # Start it explicitly with --profile ollama-gpu and set
  # PA_OLLAMA_BASE_URL=http://ollama:11434 in .env.container.
  ollama:
    image: ollama/ollama:0.32.3
    profiles:
      - ollama-gpu
    restart: unless-stopped
    gpus: all
    expose:
      - "11434"
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - egress

networks:
  backend:
    internal: true
  egress:
    driver: bridge

volumes:
  mysql_data:
  private_agent_data:
  ollama_data:

secrets:
  api_token:
    file: ${PA_API_TOKEN_SECRET_FILE:?PA_API_TOKEN_SECRET_FILE is required}
  mysql_password:
    file: ${PA_MYSQL_PASSWORD_SECRET_FILE:?PA_MYSQL_PASSWORD_SECRET_FILE is required}
  mysql_root_password:
    file: ${PA_MYSQL_ROOT_PASSWORD_SECRET_FILE:?PA_MYSQL_ROOT_PASSWORD_SECRET_FILE is required}
