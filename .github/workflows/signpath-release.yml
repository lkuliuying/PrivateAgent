name: Windows Tauri draft release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 已存在的非预发布草稿标签（vX.Y.Z）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-draft-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-sign-release:
    name: Build, verify, and attach draft assets
    if: github.repository == 'lkuliuying/PrivateAgent'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      RELEASE_REPOSITORY: lkuliuying/PrivateAgent
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Validate release input
        run: |
          if ($env:GITHUB_REPOSITORY -cne $env:RELEASE_REPOSITORY) { throw 'Unexpected release repository' }
          if ($env:RELEASE_TAG -cnotmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
            throw 'Release tag must be vX.Y.Z without leading zeros or prerelease suffixes'
          }
          $cacheDirectory = Join-Path $env:RUNNER_TEMP 'privateagent-uv-cache'
          "UV_CACHE_DIR=$cacheDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate tagged source and existing draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.Substring(1)
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checked-out commit' }
          $tagCommit = git rev-parse "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0 -or $headCommit -cne $tagCommit) { throw 'Checked-out commit does not match release tag' }
          $tauri = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $cargoVersion = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('apps/desktop/src-tauri/Cargo.toml').read_text(encoding='utf-8'))['package']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Cargo package version' }
          if ($tauri.version -cne $version -or $package.version -cne $version -or $cargoVersion -cne $version) {
            throw 'Release tag does not match tauri.conf.json, package.json, and Cargo.toml versions'
          }
          if ($tauri.identifier -cne 'com.personal-assistant.desktop') { throw 'Unexpected application identifier' }
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0 -or $status) { throw 'Release source must have a clean Git working tree' }
          $releaseJson = gh release view $tag --repo $env:RELEASE_REPOSITORY --json id,tagName,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'The release draft must already exist' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -cne $tag -or $release.isDraft -ne $true -or $release.isPrerelease -ne $false -or [string]::IsNullOrWhiteSpace($release.id)) {
            throw 'Release must be the requested existing non-prerelease draft'
          }
          $assetNames = @("PrivateAgent_${version}_x64-setup.exe", "PrivateAgent_${version}_x64-setup.exe.sig", 'latest.json', "release-verification-${version}.json", "release-manifest-${version}.md")
          $collisions = @($release.assets | Where-Object { $_.name -in $assetNames })
          if ($collisions.Count -gt 0) { throw 'Draft already contains a planned asset; overwriting is forbidden' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$headCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install local executor build dependencies
        run: uv sync --locked --all-extras

      - name: Build the Tauri-signed Windows installer
        id: build
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Tauri signing secret is not configured' }
          .\scripts\build-client.cmd --release --version $env:RELEASE_VERSION --github-repo $env:RELEASE_REPOSITORY | Tee-Object -Variable buildLog
          if ($LASTEXITCODE -ne 0) { throw 'Local desktop build failed' }
          $output = @($buildLog | Where-Object { $_ -like 'Build output: *' })
          if ($output.Count -ne 1) { throw 'Expected one local build output directory' }
          $bundle = (Resolve-Path -LiteralPath $output[0].Substring('Build output: '.Length)).Path
          $outputRoot = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '.run')) + [IO.Path]::DirectorySeparatorChar
          if (-not $bundle.StartsWith($outputRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Build output is outside the expected directory' }
          "bundle=$bundle" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify final updater assets and record evidence
        id: verified
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BUILD_BUNDLE: ${{ steps.build.outputs.bundle }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          $version = $env:RELEASE_VERSION
          $bundle = $env:BUILD_BUNDLE
          $installer = Join-Path $bundle "publish/$version/PrivateAgent_${version}_x64-setup.exe"
          $manifest = Join-Path $bundle 'publish/latest.json'
          $info = Get-Content (Join-Path $bundle 'build-info.json') -Raw | ConvertFrom-Json
          if ($info.commit -cne $env:RELEASE_COMMIT -or $info.dirty -ne $false) { throw 'Build evidence does not match the clean tagged commit' }
          $verifier = 'apps/desktop/src-tauri/target/release/private-agent-updater-signature-verifier.exe'
          if (-not (Test-Path -LiteralPath $verifier -PathType Leaf)) { throw 'Build did not produce the updater signature verifier' }
          $verification = & .\.venv\Scripts\python.exe -B scripts/verify_update_release.py --bundle $bundle --installer $installer --manifest $manifest --repo $env:RELEASE_REPOSITORY --verifier $verifier
          if ($LASTEXITCODE -ne 0) { throw 'Final updater release verification failed' }
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "privateagent-release-$version"
          New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null
          $verificationPath = Join-Path $evidenceDirectory "release-verification-$version.json"
          $verification | Set-Content -LiteralPath $verificationPath -Encoding utf8
          $releaseManifest = Join-Path $evidenceDirectory "release-manifest-$version.md"
          & .\.venv\Scripts\python.exe -B scripts/generate_release_manifest.py --bundle $bundle --installer $installer --out $releaseManifest
          if ($LASTEXITCODE -ne 0) { throw 'Release evidence generation failed' }
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest=$manifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "verification=$verificationPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_manifest=$releaseManifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Retain verified assets and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privateagent-${{ steps.release.outputs.version }}-windows-verified
          path: |
            ${{ steps.verified.outputs.installer }}
            ${{ steps.verified.outputs.installer }}.sig
            ${{ steps.verified.outputs.manifest }}
            ${{ steps.verified.outputs.verification }}
            ${{ steps.verified.outputs.release_manifest }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach verified assets to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          INSTALLER_PATH: ${{ steps.verified.outputs.installer }}
          MANIFEST_PATH: ${{ steps.verified.outputs.manifest }}
          VERIFICATION_PATH: ${{ steps.verified.outputs.verification }}
          RELEASE_MANIFEST_PATH: ${{ steps.verified.outputs.release_manifest }}
        run: |
          $assets = @($env:INSTALLER_PATH, "$($env:INSTALLER_PATH).sig", $env:MANIFEST_PATH, $env:VERIFICATION_PATH, $env:RELEASE_MANIFEST_PATH)
          $expectedNames = @("PrivateAgent_$($env:RELEASE_VERSION)_x64-setup.exe", "PrivateAgent_$($env:RELEASE_VERSION)_x64-setup.exe.sig", 'latest.json', "release-verification-$($env:RELEASE_VERSION).json", "release-manifest-$($env:RELEASE_VERSION).md")
          for ($index = 0; $index -lt $assets.Count; $index++) {
            $asset = Get-Item -LiteralPath $assets[$index]
            if ($asset.PSIsContainer -or $asset.Name -cne $expectedNames[$index] -or $asset.Length -eq 0) { throw 'Unexpected or empty upload asset' }
          }
          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json id,tagName,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'Cannot recheck the release draft before upload' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.id -cne $env:EXPECTED_RELEASE_ID -or $release.tagName -cne $env:RELEASE_TAG -or $release.isDraft -ne $true -or $release.isPrerelease -ne $false) {
            throw 'Release draft changed during the build; uploading is forbidden'
          }
          $collisions = @($release.assets | Where-Object { $_.name -in $expectedNames })
          if ($collisions.Count -gt 0) { throw 'Draft already contains a planned asset; overwriting is forbidden' }
          gh release upload $env:RELEASE_TAG @assets --repo $env:RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed; inspect partial assets before retrying' }
          Write-Output 'Verified assets attached to the draft. Publishing and marking Latest require a separate manual action.'
