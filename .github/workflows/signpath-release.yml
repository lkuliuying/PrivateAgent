name: SignPath Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the signed assets
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: signpath-${{ github.event.release.tag_name || github.event.inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build-sign-release:
    name: Build, SignPath sign, and publish
    if: >-
      github.repository == 'lkuliuying/PrivateAgent' &&
      !startsWith(github.event.release.tag_name || github.event.inputs.release_tag, 'remote-v')
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      UV_CACHE_DIR: ${{ github.workspace }}\.uv-cache
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
      RELEASE_EVENT_NAME: ${{ github.event_name }}
      RELEASE_EVENT_SHA: ${{ github.sha }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ format('refs/tags/{0}', github.event.release.tag_name || github.event.inputs.release_tag) }}
          fetch-depth: 0

      - name: Verify release source
        id: release
        run: ./scripts/verify-release.ps1 -Mode Source

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed.' }

      - name: Validate signing configuration
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
            SIGNPATH_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
            TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing required SignPath release configuration: $($missing -join ', ')"
          }

      - name: Build the unsigned Windows installer
        run: |
          .\scripts\build-release.bat
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }

      - name: Locate unsigned installer
        id: unsigned
        run: |
          $installers = @(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          "path=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$($installers[0].Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload immutable unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privateagent-${{ steps.release.outputs.version }}-windows-unsigned
          path: ${{ steps.unsigned.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Submit signing request to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-output
          parameters: |
            version: ${{ toJSON(steps.release.outputs.version) }}

      - name: Record SignPath request evidence
        env:
          SIGNPATH_REQUEST_ID: ${{ steps.signpath.outputs.signing-request-id }}
          SIGNPATH_REQUEST_URL: ${{ steps.signpath.outputs.signing-request-web-url }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $evidence = [ordered]@{
            provider = 'SignPath'
            signing_request_id = $env:SIGNPATH_REQUEST_ID
            signing_request_url = $env:SIGNPATH_REQUEST_URL
            repository = $env:GITHUB_REPOSITORY
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            commit = $env:RELEASE_COMMIT
            tag = $env:RELEASE_TAG
            version = $env:RELEASE_VERSION
          }
          $path = "dist/signpath-request-$env:RELEASE_VERSION.json"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $evidence | ConvertTo-Json | Set-Content -LiteralPath $path -Encoding utf8

      - name: Install and verify the signed installer
        id: signed
        env:
          UNSIGNED_INSTALLER_PATH: ${{ steps.unsigned.outputs.path }}
        run: |
          $signed = @(Get-ChildItem signed-output -Recurse -Filter '*-setup.exe' -File)
          if ($signed.Count -ne 1) {
            throw "Expected exactly one signed NSIS installer, found $($signed.Count)."
          }
          $target = $env:UNSIGNED_INSTALLER_PATH
          Copy-Item -LiteralPath $signed[0].FullName -Destination $target -Force
          uv run python scripts/sign_installer.py --installer $target --verify-existing --provider SignPath
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer verification failed.' }
          "path=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Regenerate updater signature over signed bytes
        working-directory: apps/desktop
        env:
          SIGNED_INSTALLER_PATH: ${{ steps.signed.outputs.path }}
        run: |
          npx tauri signer sign -f $env:SIGNED_INSTALLER_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Updater signing failed.' }

      - name: Generate updater manifest and release evidence
        run: |
          uv run python scripts/generate-latest-json.py --repo lkuliuying/PrivateAgent --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Updater manifest generation failed.' }
          uv run python scripts/generate_release_manifest.py --write
          if ($LASTEXITCODE -ne 0) { throw 'Release evidence generation failed.' }

      - name: Verify updater signature and manifest
        env:
          SIGNED_INSTALLER_PATH: ${{ steps.signed.outputs.path }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $installer = Get-Item -LiteralPath $env:SIGNED_INSTALLER_PATH
          $sig = Get-Item -LiteralPath "$($installer.FullName).sig"
          $manifest = Get-Content dist/latest.json -Raw | ConvertFrom-Json
          if ($manifest.version -cne $env:RELEASE_VERSION) { throw 'latest.json version mismatch' }
          if ($manifest.platforms.'windows-x86_64'.signature -ne (Get-Content $sig.FullName -Raw).Trim()) {
            throw 'latest.json updater signature mismatch'
          }
          Get-FileHash -Algorithm SHA256 $installer.FullName

      - name: Upload signed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privateagent-${{ steps.release.outputs.version }}-windows-signed
          path: |
            ${{ steps.signed.outputs.path }}
            ${{ steps.signed.outputs.path }}.sig
            dist/latest.json
            dist/codesign-status-${{ steps.release.outputs.version }}.json
            dist/signpath-request-${{ steps.release.outputs.version }}.json
            dist/release-manifest-${{ steps.release.outputs.version }}.md
          if-no-files-found: error
          retention-days: 30

      - name: Attach verified assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_INSTALLER_PATH: ${{ steps.signed.outputs.path }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $assets = @(
            $env:SIGNED_INSTALLER_PATH
            "$env:SIGNED_INSTALLER_PATH.sig"
            'dist/latest.json'
            "dist/codesign-status-$env:RELEASE_VERSION.json"
            "dist/signpath-request-$env:RELEASE_VERSION.json"
            "dist/release-manifest-$env:RELEASE_VERSION.md"
          )
          ./scripts/verify-release.ps1 -Mode Assets -AssetPaths $assets
          # 预检后仍可能出现并发上传；不传覆盖选项，由服务端拒绝同名附件。
          gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; inspect partial assets before retrying.' }
