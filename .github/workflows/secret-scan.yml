name: Secret scan

on:
  push:
    branches: [main, dev/1.0.0]
  pull_request:
    branches: [main, dev/1.0.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan full Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整历史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 下载并校验固定版本扫描器
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          mkdir -p "$tool_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${tool_dir}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${tool_dir}/${archive}" | sha256sum --check --strict
          tar -xzf "${tool_dir}/${archive}" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: 扫描全部引用历史并隐藏凭据内容
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --config .gitleaks.toml --log-opts="--all --full-history" \
            --redact=100 --ignore-gitleaks-allow --no-banner --log-level warn
